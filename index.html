<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GESTAV</title>
<meta name="description" content="Gestão técnico-económica da produção de frangos de corte na granja da FAVET-UEM">
<meta name="theme-color" content="#143620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GESTAV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --verde:#143620; --verde2:#1F4D2B; --ouro:#C8963E; --creme:#F4F1E8; }
  html, body { margin:0; height:100%; background:var(--verde); overflow:hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff;
         padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  #abertura { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
              justify-content:center; gap:18px; color:var(--creme); text-align:center; padding:24px;
              background:linear-gradient(160deg,var(--verde2),var(--verde)); transition:opacity .4s; z-index:2; }
  #abertura.fechar { opacity:0; pointer-events:none; }
  #abertura h1 { margin:0; font-family: Georgia, "Times New Roman", serif; font-size:34px; letter-spacing:.5px; }
  #abertura p { margin:0; max-width:300px; font-size:15px; line-height:1.45; opacity:.85; }
  .sub { font-size:11px !important; letter-spacing:3px; text-transform:uppercase; color:var(--ouro); opacity:1 !important; }
  .barra { width:140px; height:4px; border-radius:4px; background:rgba(255,255,255,.15); overflow:hidden; }
  .barra::after { content:""; display:block; width:40%; height:100%; background:var(--ouro); border-radius:4px;
                  animation:corre 1.2s ease-in-out infinite; }
  @keyframes corre { 0%{transform:translateX(-100%)} 100%{transform:translateX(250%)} }
  #demora, #semnet { display:none; }
  a.botao { display:inline-block; margin-top:6px; padding:10px 18px; border-radius:10px; background:var(--ouro);
            color:var(--verde); font-weight:700; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<div id="abertura" role="status">
  <svg width="84" height="84" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M32 7C44 7 52 25 52 37.5C52 49 43.5 57 32 57C20.5 57 12 49 12 37.5C12 25 20 7 32 7Z" fill="#C8963E"/>
    <path d="M32 7C44 7 52 25 52 37.5C52 49 43.5 57 32 57" fill="none" stroke="#E8B962" stroke-width="2" opacity=".7"/>
    <polyline points="19,43 27,35.5 33,39.5 44,27.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="37.5,27 44.5,27 44.5,34" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>GESTAV</h1>
  <p class="sub">Granja FAVET-UEM</p>
  <div class="barra" id="barra"></div>
  <p id="msg">A abrir o sistema...</p>
  <div id="demora">
    <p>O servidor estava em repouso e está a acordar. Isto pode levar até um minuto.</p>
    <a class="botao" id="directo" target="_blank" rel="noopener">Abrir no navegador</a>
  </div>
  <div id="semnet">
    <p>Sem ligação à internet. O GESTAV precisa de internet para ler e gravar os dados da granja.</p>
    <a class="botao" href="" onclick="location.reload();return false;">Tentar de novo</a>
  </div>
</div>

<script>
  // Endereço da aplicação no Streamlit Cloud. Se mudar, basta alterar esta linha.
  const APP_URL = "https://gestav-favet.streamlit.app";

  const abertura = document.getElementById("abertura");
  document.getElementById("directo").href = APP_URL;

  function semInternet() {
    document.getElementById("barra").style.display = "none";
    document.getElementById("msg").style.display = "none";
    document.getElementById("demora").style.display = "none";
    document.getElementById("semnet").style.display = "block";
  }

  if (!navigator.onLine) {
    semInternet();
  } else {
    const f = document.createElement("iframe");
    f.id = "app";
    f.title = "GESTAV";
    f.allow = "clipboard-write; fullscreen";
    f.src = APP_URL + "/?embed=true&embed_options=light_theme";
    // O Streamlit precisa de alguns segundos depois do carregamento para desenhar o ecrã
    f.addEventListener("load", () => setTimeout(() => abertura.classList.add("fechar"), 1500));
    document.body.appendChild(f);
    setTimeout(() => {
      if (!abertura.classList.contains("fechar")) {
        document.getElementById("msg").style.display = "none";
        document.getElementById("demora").style.display = "block";
      }
    }, 12000);
  }
  window.addEventListener("offline", semInternet);
  window.addEventListener("online", () => location.reload());

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
