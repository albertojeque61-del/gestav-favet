<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GESTAV</title>
<meta name="description" content="Gestão técnico-económica da produção de frangos de corte na granja da FAVET-UEM">
<meta name="theme-color" content="#143620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GESTAV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --verde:#143620; --verde2:#1F4D2B; --ouro:#C8963E; --creme:#F4F1E8; }
  html, body { margin:0; height:100%; background:var(--verde); overflow:hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff;
         padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  #abertura { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
              justify-content:center; gap:18px; color:var(--creme); text-align:center; padding:24px;
              background:linear-gradient(160deg,var(--verde2),var(--verde)); transition:opacity .4s; z-index:2; }
  #abertura.fechar { opacity:0; pointer-events:none; }
  #abertura h1 { margin:0; font-family: Georgia, "Times New Roman", serif; font-size:34px; letter-spacing:.5px; }
  #abertura p { margin:0; max-width:300px; font-size:15px; line-height:1.45; opacity:.85; }
  .sub { font-size:11px !important; letter-spacing:3px; text-transform:uppercase; color:var(--ouro); opacity:1 !important; }
  .barra { width:140px; height:4px; border-radius:4px; background:rgba(255,255,255,.15); overflow:hidden; }
  .barra::after { content:""; display:block; width:40%; height:100%; background:var(--ouro); border-radius:4px;
                  animation:corre 1.2s ease-in-out infinite; }
  @keyframes corre { 0%{transform:translateX(-100%)} 100%{transform:translateX(250%)} }
  #demora, #semnet { display:none; }
  a.botao { display:inline-block; margin-top:6px; padding:10px 18px; border-radius:10px; background:var(--ouro);
            color:var(--verde); font-weight:700; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<div id="abertura" role="status">
  <svg width="110" height="110" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-label="GESTAV"><defs><radialGradient id="abbg" cx="35%" cy="28%" r="85%"><stop offset="0" stop-color="#2E7043"/><stop offset=".55" stop-color="#173D24"/><stop offset="1" stop-color="#0B2113"/></radialGradient><filter id="absh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".38"/></filter><filter id="abshp" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter><filter id="abb4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter><filter id="abb8" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><radialGradient id="abcorpo" cx="55%" cy="35%" r="75%"><stop offset="0" stop-color="#F1C87E"/><stop offset=".45" stop-color="#D0943F"/><stop offset=".85" stop-color="#9A6226"/><stop offset="1" stop-color="#734515"/></radialGradient><linearGradient id="abasa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4843A"/><stop offset="1" stop-color="#7A4A18"/></linearGradient><linearGradient id="abcauda" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A3410"/><stop offset="1" stop-color="#A86C2A"/></linearGradient><linearGradient id="abcrista" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0604C"/><stop offset="1" stop-color="#A3261C"/></linearGradient><linearGradient id="abbico" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D163"/><stop offset="1" stop-color="#C98E22"/></linearGradient><linearGradient id="abperna" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9B23F"/><stop offset="1" stop-color="#B07A1C"/></linearGradient></defs><ellipse cx="128" cy="226" rx="74" ry="9" fill="#000" opacity=".35" filter="url(#abb4)"/><path d="M78 150 C52 120 48 82 60 58 C70 88 86 108 104 120 Z" fill="url(#abcauda)"/><path d="M74 142 C60 116 66 86 82 70 C84 96 96 112 110 122 Z" fill="#8A561E"/><g stroke="url(#abperna)" stroke-width="8" stroke-linecap="round" fill="none"><path d="M112 196 L110 222"/><path d="M146 196 L148 222"/><path d="M110 222 L96 226 M110 222 L114 227 M110 222 L124 225"/><path d="M148 222 L134 225 M148 222 L150 227 M148 222 L162 226"/></g><path d="M150 50 C146 34 158 26 164 38 C166 22 180 22 181 36 C188 26 200 32 194 50 Z" fill="url(#abcrista)" filter="url(#abshp)"/><path d="M62 150 C62 112 94 92 132 96 C144 72 142 54 154 44 C168 34 188 40 192 56 C196 68 192 82 184 94 C208 110 216 136 208 160 C198 192 164 208 126 206 C88 204 62 184 62 150 Z" fill="url(#abcorpo)" filter="url(#absh)"/><ellipse cx="176" cy="126" rx="16" ry="26" fill="#FFF3D6" opacity=".35" filter="url(#abb8)"/><path d="M90 142 C108 118 152 116 174 138 C164 170 130 186 100 178 C88 168 86 154 90 142 Z" fill="url(#abasa)" filter="url(#abshp)"/><g fill="none" stroke="#5E3812" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"><path d="M100 150 C118 140 146 140 164 146"/><path d="M98 160 C118 152 142 154 158 160"/><path d="M102 170 C118 166 136 168 148 172"/></g><path d="M189 58 L210 66 L189 74 Z" fill="url(#abbico)"/><path d="M189 66 L209 66" stroke="#9C6A18" stroke-width="1.5"/><path d="M184 76 C180 92 194 98 197 84 C198 79 194 76 190 76 Z" fill="url(#abcrista)"/><circle cx="171" cy="60" r="7" fill="#2A1A08"/><circle cx="173.5" cy="57.5" r="2.4" fill="#fff"/></svg>
  <h1>GESTAV</h1>
  <p class="sub">Granja FAVET-UEM</p>
  <div class="barra" id="barra"></div>
  <p id="msg">A abrir o sistema...</p>
  <div id="demora">
    <p>O servidor estava em repouso e está a acordar. Isto pode levar até um minuto.</p>
    <a class="botao" id="directo" target="_blank" rel="noopener">Abrir no navegador</a>
  </div>
  <div id="semnet">
    <p>Sem ligação à internet. O GESTAV precisa de internet para ler e gravar os dados da granja.</p>
    <a class="botao" href="" onclick="location.reload();return false;">Tentar de novo</a>
  </div>
</div>

<script>
  // Endereço da aplicação no Streamlit Cloud. Se mudar, basta alterar esta linha.
  const APP_URL = "https://gestav-favet.streamlit.app";

  const abertura = document.getElementById("abertura");
  document.getElementById("directo").href = APP_URL;

  function semInternet() {
    document.getElementById("barra").style.display = "none";
    document.getElementById("msg").style.display = "none";
    document.getElementById("demora").style.display = "none";
    document.getElementById("semnet").style.display = "block";
  }

  if (!navigator.onLine) {
    semInternet();
  } else {
    const f = document.createElement("iframe");
    f.id = "app";
    f.title = "GESTAV";
    f.allow = "clipboard-write; fullscreen";
    f.src = APP_URL + "/?embed=true&embed_options=light_theme";
    // O Streamlit precisa de alguns segundos depois do carregamento para desenhar o ecrã
    f.addEventListener("load", () => setTimeout(() => abertura.classList.add("fechar"), 1500));
    document.body.appendChild(f);
    setTimeout(() => {
      if (!abertura.classList.contains("fechar")) {
        document.getElementById("msg").style.display = "none";
        document.getElementById("demora").style.display = "block";
      }
    }, 12000);
  }
  window.addEventListener("offline", semInternet);
  window.addEventListener("online", () => location.reload());

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
